---
- name: Configure and deploy api (jar + deterministic lib archive + systemd)
  hosts: api
  become: yes

  vars:
    api_user: numpty
    api_group: numpty
    api_home: /opt/numpty/api
    api_jar_name: api-1.0-SNAPSHOT.jar
    # 본인 로컬의 api 프로젝트 target 디렉터리.
    # jar 본체 + lib.tar.gz(deploy.yml의 Archive 스텝이 만든 것)가 여기 있음.
    local_target_dir: "{{ playbook_dir }}/../../api/target"
    env_file_path: /etc/numpty-api.env
    systemd_unit_path: /etc/systemd/system/numpty-api.service
    jdk_path: /opt/jdk-17

  tasks:
    # ===== api 배포 디렉터리 준비 =====
    # lib/ 는 아래 unarchive가 만들므로 따로 안 만든다.
    - name: Ensure api directory exists
      ansible.builtin.file:
        path: "{{ api_home }}"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0755"
        state: directory

    # ===== jar 본체 전달 (단일 파일) =====
    # 앱 코드라 매 빌드 바뀜. 파일 1개라 copy의 변경감지/전송이 빠르다.
    - name: Copy api jar to remote
      ansible.builtin.copy:
        src: "{{ local_target_dir }}/{{ api_jar_name }}"
        dest: "{{ api_home }}/{{ api_jar_name }}"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0644"
      notify: Restart api

    # ===== 의존성 lib 아카이브 전달 =====
    # 결정적 tar라 deps 안 바뀌면 바이트 동일 → copy가 changed=0 → 전송 스킵.
    # 수십 개 파일을 파일별로 체크하던 왕복이 단일 파일 체크 1회로 collapse.
    # deps 바뀔 때만 새 아카이브가 전송되고 아래 해제가 돈다.
    - name: Copy api lib archive to remote
      ansible.builtin.copy:
        src: "{{ local_target_dir }}/lib.tar.gz"
        dest: "{{ api_home }}/lib.tar.gz"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0644"
      register: lib_archive
      notify: Restart api

    # ===== 변경 시에만: 기존 lib/ 청소 후 재해제 =====
    # 청소를 먼저 하는 이유 — 의존성이 '제거'된 경우 옛 jar가 남는 걸 방지.
    # unarchive는 덮어쓰지만 사라진 파일은 안 지우므로 청소가 필요.
    - name: Clean lib directory before unpack (only when archive changed)
      ansible.builtin.file:
        path: "{{ api_home }}/lib"
        state: absent
      when: lib_archive.changed

    # 아카이브가 lib/ 디렉터리를 담고 있으므로 api_home에 풀면 api_home/lib/ 재생성.
    - name: Unpack api lib archive (only when changed)
      ansible.builtin.unarchive:
        src: "{{ api_home }}/lib.tar.gz"
        dest: "{{ api_home }}/"
        remote_src: yes
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
      when: lib_archive.changed
      notify: Restart api

    # ===== EnvironmentFile 생성 (vault → systemd 다리) =====
    - name: Create EnvironmentFile for systemd
      ansible.builtin.copy:
        dest: "{{ env_file_path }}"
        content: |
          # NumPTY api environment - generated by Ansible
          # DO NOT EDIT MANUALLY - changes will be overwritten on next deploy

          # === Database connections ===
          DB_URL=jdbc:mysql://{{ mysql_private_ip }}:3306/{{ mysql_app_database }}
          DB_USERNAME={{ mysql_app_user }}
          DB_PASSWORD={{ mysql_app_password }}

          MONGODB_URI=mongodb://{{ mongo_private_ip }}:27017
          MONGODB_DATABASE={{ mongo_app_database }}
          MONGODB_CREDENTIAL_DATABASE={{ mongo_app_database }}
          MONGODB_CREDENTIAL_USERNAME={{ mongo_app_user }}
          MONGODB_CREDENTIAL_PASSWORD={{ mongo_app_password }}

          REDIS_HOST={{ redis_private_ip }}
          REDIS_PASSWORD={{ redis_password }}

          # === Secrets ===
          JWT_SECRET={{ jwt_secret }}

          # === Operational toggles ===
          DB_INIT_SCHEMA=true
        owner: root
        group: "{{ api_group }}"
        mode: "0640"
      no_log: true
      notify: Restart api

    # ===== systemd unit 생성 =====
    - name: Create systemd unit for api
      ansible.builtin.copy:
        dest: "{{ systemd_unit_path }}"
        content: |
          [Unit]
          Description=NumPTY API
          After=network.target

          [Service]
          Type=simple
          User={{ api_user }}
          Group={{ api_group }}
          WorkingDirectory={{ api_home }}
          EnvironmentFile={{ env_file_path }}
          ExecStart={{ jdk_path }}/bin/java -jar {{ api_home }}/{{ api_jar_name }}
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart api

    # ===== 서비스 활성화 =====
    - name: Enable and start numpty-api service
      ansible.builtin.systemd:
        name: numpty-api
        enabled: yes
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    # jar/lib/env/unit 중 무엇이든 바뀌면 재시작. 여러 notify를 받아도
    # handler는 playbook 끝에 한 번만 실행.
    - name: Restart api
      ansible.builtin.systemd:
        name: numpty-api
        state: restarted

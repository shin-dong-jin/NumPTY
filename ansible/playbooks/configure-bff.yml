---
- name: Configure and deploy bff (source archive + npm install + setup_os + PM2 + systemd)
  hosts: bff
  become: yes

  vars:
    api_user: numpty
    api_group: numpty
    bff_home: /opt/numpty/bff
    # deploy.yml의 'Archive bff source' 스텝이 만든 결정적 소스 아카이브.
    # node_modules 제외, 소스만. 레포 루트에 위치.
    src_archive: "{{ playbook_dir }}/../../bff-src.tar.gz"
    env_file_path: /etc/numpty-bff.env
    systemd_unit_path: /etc/systemd/system/numpty-bff.service

  tasks:
    # ===== 소스 아카이브 전달 =====
    # 결정적 tar라 소스 안 바뀌면 바이트 동일 → copy가 changed=0 → 전송 스킵.
    # 수많은 소스 파일을 파일별로 체크하던 왕복이 단일 파일 체크 1회로 collapse.
    # 변수명 source_sync 유지 - 아래 install/setup_os 게이팅이 이걸 참조.
    - name: Copy bff source archive to EC2
      ansible.builtin.copy:
        src: "{{ src_archive }}"
        dest: "{{ bff_home }}/src.tar.gz"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0644"
      register: source_sync

    # ===== 소스 해제 (overlay - node_modules 보존) =====
    # 청소하지 않고 그대로 덮어쓴다. 아카이브엔 소스만 있으므로 소스 파일만
    # 갱신되고, 이전 npm install이 만든 node_modules는 그대로 살아남는다.
    # (clean 후 unpack 하면 node_modules가 날아가 매번 풀 재설치 → 증분 깨짐.)
    - name: Unpack bff source (overlay, preserves node_modules)
      ansible.builtin.unarchive:
        src: "{{ bff_home }}/src.tar.gz"
        dest: "{{ bff_home }}/"
        remote_src: yes
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
      when: source_sync.changed
      notify: Restart bff

    # ===== npm install =====
    # 네이티브 패키지(node-pty 등)는 EC2에서 빌드 -> install-bff가 깐
    # gcc/gcc-c++/make/python3 사용. 소스 바뀌었을 때만 재설치.
    # --omit=dev: 운영 의존성만.
    - name: Install npm dependencies
      ansible.builtin.command:
        cmd: npm install --omit=dev
        chdir: "{{ bff_home }}"
      become_user: "{{ api_user }}"
      when: source_sync.changed
      notify: Restart bff

    # ===== setup_os.sh 실행 =====
    # 격리된 터미널 환경 구성 + C wrapper 컴파일. EC2 환경 기준 생성.
    # 소스 바뀌었을 때만.
    - name: Run setup_os.sh
      ansible.builtin.command:
        cmd: bash setup_os.sh
        chdir: "{{ bff_home }}"
      become_user: "{{ api_user }}"
      when: source_sync.changed
      notify: Restart bff

    # ===== EnvironmentFile 생성 =====
    - name: Create EnvironmentFile for systemd
      ansible.builtin.copy:
        dest: "{{ env_file_path }}"
        content: |
          # NumPTY bff environment - generated by Ansible
          # DO NOT EDIT MANUALLY - changes will be overwritten on next deploy

          REDIS_HOST={{ redis_private_ip }}
          REDIS_PORT=6379
          REDIS_PASSWORD={{ redis_password }}

          API_BASE=http://{{ api_private_ip }}:8080
        owner: root
        group: "{{ api_group }}"
        mode: "0640"
      no_log: true
      notify: Restart bff

    # ===== systemd unit 생성 =====
    # ExecStart가 pm2-runtime -> ecosystem.config.cjs 읽어 app+daemon 둘 다.
    - name: Create systemd unit for bff
      ansible.builtin.copy:
        dest: "{{ systemd_unit_path }}"
        content: |
          [Unit]
          Description=NumPTY BFF (PM2 managed: app + daemon)
          After=network.target

          [Service]
          Type=simple
          User={{ api_user }}
          Group={{ api_group }}
          WorkingDirectory={{ bff_home }}
          EnvironmentFile={{ env_file_path }}
          ExecStart=/usr/bin/pm2-runtime start {{ bff_home }}/ecosystem.config.cjs
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart bff

    # ===== 서비스 활성화 =====
    - name: Enable and start numpty-bff service
      ansible.builtin.systemd:
        name: numpty-bff
        enabled: yes
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Restart bff
      ansible.builtin.systemd:
        name: numpty-bff
        state: restarted

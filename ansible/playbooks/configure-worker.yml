---
- name: Configure and deploy worker (ship prebuilt binary + EnvironmentFile + systemd)
  hosts: worker
  become: yes

  vars:
    api_user: numpty
    api_group: numpty
    worker_home: /opt/numpty/worker
    worker_binary: "{{ worker_home }}/build/worker"
    # CI가 AL2023 컨테이너에서 빌드한 산출물이 runner의 worker/build/worker에 있음.
    # (deploy.yml의 'Build worker in AL2023 container' 스텝이 만든 것.)
    local_worker_dir: "{{ playbook_dir }}/../../worker"
    env_file_path: /etc/numpty-worker.env
    systemd_unit_path: /etc/systemd/system/numpty-worker.service

  tasks:
    # ===== 바이너리 놓을 디렉터리 =====
    # 예전엔 EC2에서 cmake가 build/를 만들었지만, 이제 CI에서 빌드하므로
    # 빈 build/만 준비해 두고 바이너리를 그 안에 떨군다.
    - name: Ensure worker build directory exists
      ansible.builtin.file:
        path: "{{ worker_home }}/build"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0755"
        state: directory

    # ===== CI에서 빌드된 바이너리 배치 =====
    # 더 이상 EC2에서 컴파일하지 않음 — AL2023 컨테이너 산출물을 그대로 복사.
    # copy가 md5로 변경 감지 → 같은 바이너리면 changed=0 (멱등), 바뀌면 재시작.
    - name: Copy prebuilt worker binary
      ansible.builtin.copy:
        src: "{{ local_worker_dir }}/build/worker"
        dest: "{{ worker_binary }}"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: "0755"
      notify: Restart worker

    # ===== 런타임 자산 =====
    # 바이너리가 WorkingDirectory({{ worker_home }}) 기준 상대경로로 읽는 파일.
    # EnvironmentFile의 BANNER_PATH=resource/banner.logo 가 그 예.
    # 소스 전체가 아니라 런타임에 필요한 자산만 — 빌드 산출물·소스는 안 보냄.
    - name: Copy worker runtime resources
      ansible.builtin.copy:
        src: "{{ local_worker_dir }}/resource/"
        dest: "{{ worker_home }}/resource/"
        owner: "{{ api_user }}"
        group: "{{ api_group }}"
        mode: preserve
      notify: Restart worker

    # ===== EnvironmentFile 생성 =====
    - name: Create EnvironmentFile for systemd
      ansible.builtin.copy:
        dest: "{{ env_file_path }}"
        content: |
          # NumPTY worker environment - generated by Ansible
          # DO NOT EDIT MANUALLY - changes will be overwritten on next deploy

          REDIS_HOST={{ redis_private_ip }}
          REDIS_PORT=6379
          REDIS_PASSWORD={{ redis_password }}

          CONSUMER_GROUP=cg-worker
          STREAM_REQUEST=numpty:was:request
          STREAM_RESPONSE=numpty:worker:response

          BLOCK_TIMEOUT_MS=1
          BANNER_PATH=resource/banner.logo
          TARGET_LOG_LEVEL=1
        owner: root
        group: "{{ api_group }}"
        mode: "0640"
      no_log: true
      notify: Restart worker

    # ===== systemd unit 생성 =====
    # WorkingDirectory가 worker_home이라 ExecStart 바이너리가 resource/를
    # 상대경로로 찾는다. ExecStart는 build/worker 절대경로.
    - name: Create systemd unit for worker
      ansible.builtin.copy:
        dest: "{{ systemd_unit_path }}"
        content: |
          [Unit]
          Description=NumPTY Worker
          After=network.target

          [Service]
          Type=simple
          User={{ api_user }}
          Group={{ api_group }}
          WorkingDirectory={{ worker_home }}
          EnvironmentFile={{ env_file_path }}
          ExecStart={{ worker_binary }}
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart worker

    # ===== 서비스 활성화 =====
    - name: Enable and start numpty-worker service
      ansible.builtin.systemd:
        name: numpty-worker
        enabled: yes
        state: started

  handlers:
    # Reload systemd가 Restart 전에 정의돼야 새 unit 인식 후 재시작.
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Restart worker
      ansible.builtin.systemd:
        name: numpty-worker
        state: restarted

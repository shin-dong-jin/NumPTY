---
- name: Configure nginx (static web + WebSocket proxy + HTTPS via certbot)
  hosts: web
  become: yes

  vars:
    web_root: /opt/numpty/web
    # 로컬 web 프로젝트의 빌드 결과물 (vite build -> dist/)
    # playbook_dir는 ansible/playbooks. ../../web/dist.
    local_dist_dir: "{{ playbook_dir }}/../../web/dist"
    nginx_conf_path: /etc/nginx/conf.d/numpty.conf
    # install-web.yml과 같은 경로 - acme-challenge용 webroot
    acme_challenge_root: /var/lib/letsencrypt
    # Let's Encrypt가 인증서를 두는 경로 (certbot 기본값).
    # certbot live 디렉토리는 심볼릭 링크 - 갱신 시 자동 갱신.
    letsencrypt_live_dir: "/etc/letsencrypt/live/{{ domain_name }}"
    dist_archive: "{{ playbook_dir }}/../../web-dist.tar.gz"

  tasks:
    # ===== 정적 파일(dist/) EC2로 복사 =====
    # dist/ 는 청크 파일이 많아 파일별 copy가 느림 - tar로 묶어 전송 후 해제.
    # dist는 매 빌드 바뀌므로 사실상 매번 재배포(결정성 불필요).
    - name: Copy web dist archive to EC2
      ansible.builtin.copy:
        src: "{{ dist_archive }}"
        dest: /tmp/web-dist.tar.gz
        mode: "0644"
      register: dist_copy

    # 오래된 청크 잔존 방지 - web_root를 비우고 다시 채운다.
    # (acme-challenge는 /var/lib/letsencrypt라 별개, 영향 없음.)
    - name: Reset web root before unpack
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: "{{ item }}"
        owner: nginx
        group: nginx
        mode: "0755"
      loop:
        - absent
        - directory
      when: dist_copy.changed

    - name: Unpack web dist
      ansible.builtin.unarchive:
        src: /tmp/web-dist.tar.gz
        dest: "{{ web_root }}/"
        remote_src: yes
        owner: nginx
        group: nginx
      when: dist_copy.changed
      notify: Reload nginx

    # ===== 메인 nginx.conf 정리 =====
    # AL2023 기본 nginx.conf에 default server 블록이 있어서
    # 본인 conf.d/numpty.conf와 충돌 가능. 본인 명시적 버전으로 교체.
    # 80과 443은 conf.d/numpty.conf가 모두 처리.
    - name: Replace main nginx.conf (remove default server block)
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        content: |
          # NumPTY main nginx.conf - generated by Ansible
          # 기본 server 블록 제거, conf.d/*.conf만 include
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include       /etc/nginx/mime.types;
              default_type  application/octet-stream;

              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';

              access_log /var/log/nginx/access.log main;

              sendfile on;
              tcp_nopush on;
              keepalive_timeout 65;

              # conf.d의 numpty.conf가 여기서 로드됨
              include /etc/nginx/conf.d/*.conf;
          }
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    # =================================================================
    # PHASE 1: 인증서 없는 상태로 nginx 시작 (HTTP only)
    # =================================================================
    # 인증서가 아직 없으니 443 server 블록은 비활성. 80만 떠 있어야
    # certbot이 HTTP-01 challenge 통과할 수 있다.
    # 같은 template 두 번 렌더링 - 첫 번째는 ssl_enabled=false.
    - name: Deploy nginx config (HTTP only, for cert issuance)
      ansible.builtin.template:
        src: numpty.conf.j2
        dest: "{{ nginx_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        ssl_enabled: false

    - name: Validate nginx configuration (HTTP only)
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Start and enable nginx (HTTP only - for cert issuance)
      ansible.builtin.systemd:
        name: nginx
        enabled: yes
        state: started

    # `state: started`는 이미 떠 있는 nginx에는 NO-OP - 새 numpty.conf가
    # 디스크엔 있어도 메모리엔 옛 설정. 그 상태로 certbot을 부르면
    # acme-challenge location이 적용 안 돼 challenge가 index.html로 떨어진다
    # (try_files SPA fallback이 잡음). 명시적 reload로 새 설정을 메모리에
    # 강제 반영. notify handler는 playbook 끝에 실행돼 certbot보다 늦으므로
    # 여기선 task로 직접 호출.
    - name: Reload nginx to apply HTTP-only config (force - acme-challenge location must be live before certbot)
      ansible.builtin.systemd:
        name: nginx
        state: reloaded

    # =================================================================
    # PHASE 2: certbot으로 인증서 발급 (있으면 갱신/유지)
    # =================================================================
    # webroot 방식 - nginx는 떠 있고, certbot이 challenge 파일을
    # acme_challenge_root에 둠. nginx가 그걸 인터넷에 응답.
    #
    # --keep-until-expiring: 만료 30일 안일 때만 갱신, 그 외 no-op.
    # 즉 매번 실행해도 안전 (멱등).
    #
    # --non-interactive + --agree-tos + --email: 자동 실행에 필수.
    - name: Check if certificate already exists
      ansible.builtin.stat:
        path: "{{ letsencrypt_live_dir }}/fullchain.pem"
      register: cert_status

    - name: Issue certificate (first time) via certbot webroot
      ansible.builtin.command:
        cmd: >
          certbot certonly
          --webroot
          --webroot-path {{ acme_challenge_root }}
          -d {{ domain_name }}
          {% for alias in domain_aliases %}
          -d {{ alias }}
          {% endfor %}
          --email {{ letsencrypt_email }}
          --agree-tos
          --non-interactive
          --keep-until-expiring
      when: not cert_status.stat.exists
      register: cert_issuance

    - name: Renew certificate (if existing)
      ansible.builtin.command:
        cmd: certbot renew --webroot --webroot-path {{ acme_challenge_root }} --non-interactive
      when: cert_status.stat.exists
      register: cert_renewal
      changed_when: "'No renewals were attempted' not in cert_renewal.stdout"

    # =================================================================
    # PHASE 3: HTTPS 활성화한 nginx 설정 배포 + reload
    # =================================================================
    # 이제 인증서가 있으니 443 server 블록 포함 설정 배포.
    # template의 ssl_enabled=true로 443 블록 렌더링.
    - name: Deploy nginx config (HTTPS enabled)
      ansible.builtin.template:
        src: numpty.conf.j2
        dest: "{{ nginx_conf_path }}"
        owner: root
        group: root
        mode: "0644"
      vars:
        ssl_enabled: true
      notify: Reload nginx

    # ===== 설정 문법 검증 =====
    # nginx -t로 설정 오류 사전 체크. 오류 있으면 여기서 실패해서
    # 잘못된 설정으로 reload하는 것 방지 (서비스 다운 방지).
    - name: Validate nginx configuration (with SSL)
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    # =================================================================
    # PHASE 4: 자동 갱신 (systemd timer)
    # =================================================================
    # AL2023의 certbot 패키지는 certbot.timer를 함께 깔지 않으므로
    # 본인이 명시적으로 systemd timer 등록. 12시간마다 갱신 시도,
    # 만료 30일 전이 아니면 no-op (--keep-until-expiring 동작).
    #
    # nginx reload는 deploy_hook으로 - 갱신 성공 시에만 nginx 무중단 reload.
    - name: Create certbot renewal systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/certbot-renew.service
        mode: "0644"
        content: |
          [Unit]
          Description=Let's Encrypt certificate renewal
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/certbot renew --webroot --webroot-path {{ acme_challenge_root }} --non-interactive --deploy-hook "systemctl reload nginx"

    - name: Create certbot renewal systemd timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/certbot-renew.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Run certbot-renew twice daily

          [Timer]
          OnCalendar=*-*-* 00,12:00:00
          RandomizedDelaySec=3600
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable and start certbot-renew.timer
      ansible.builtin.systemd:
        name: certbot-renew.timer
        enabled: yes
        state: started
        daemon_reload: yes

  handlers:
    # reload는 무중단 - 기존 연결 유지하며 설정만 새로.
    # restart와 달리 WebSocket 연결 안 끊김 (운영에 유리).
    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
